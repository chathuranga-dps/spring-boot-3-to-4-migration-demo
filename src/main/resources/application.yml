spring:
  application:
    name: spring-boot-migration-demo

  datasource:
    # MIGRATION-DEMO: PostgreSQL datasource configuration for Spring Boot 3
    # The JDBC driver version is managed by Spring Boot parent pom.xml
    # During Boot 4 migration, driver compatibility and managed versions will be validated
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # MIGRATION-DEMO: Hibernate JPA configuration for Spring Boot 3
    # During Boot 4 migration, Hibernate compatibility and query parsing will be validated
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    # Jackson serialization/deserialization settings
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.example.migrationdemo: DEBUG
    org.hibernate.SQL: DEBUG
